<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ポケモンドロップ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  /* 高さは JS で window.innerHeight を使うので CSS では制約しない */
  width: 100%;
  overflow: hidden;
  background: #1a0a2e;
  font-family: 'Hiragino Sans', 'Meiryo', 'Segoe UI', sans-serif;
  touch-action: none;
  user-select: none;
}

#app {
  position: fixed;   /* fixed にすることでアドレスバー等を除いた実際の表示領域に収める */
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  background: #1a0a2e;
}

/* ─── トップバー ─── */
#topbar {
  display: flex;
  align-items: stretch;
  gap: 8px;
  padding: 8px 10px 4px;
  flex-shrink: 0;
}
.tb-score {
  flex: 1;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 4px 8px;
}
.tb-label { font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing:1.5px; text-transform:uppercase; }
.tb-value { font-size: 24px; font-weight: 700; color: #fff; line-height:1; }
.tb-next {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 4px 10px;
  flex-shrink: 0;
}
#next-fruit-canvas { display:block; }

/* ─── ゲームキャンバスエリア ─── */
#canvas-wrap {
  flex: 1;
  min-height: 0;       /* flexで縮める */
  position: relative;
  margin: 4px 10px 0;
  border-radius: 8px;
  overflow: hidden;
  background: #0d0626;
}
#game-canvas {
  position: absolute;
  top: 0; left: 0;
  display: block;
  touch-action: none;
}
#danger-line {
  position: absolute; left:0; width:100%; height:2px;
  pointer-events:none;
  background: rgba(255,60,60,0.3);
  border-top: 1px dashed rgba(255,80,80,0.6);
}
#drop-line {
  position: absolute; top:0; width:2px; height:100%;
  pointer-events:none;
  background: rgba(255,255,255,0.3);
  transform: translateX(-50%);
  display: none;
}

/* ─── ゲームオーバー ─── */
#game-over {
  display: none; position:absolute; inset:0;
  background: rgba(5,0,20,0.88);
  flex-direction:column; align-items:center; justify-content:center;
  gap:14px; color:#fff; z-index:10;
}
#game-over.show { display:flex; }
#game-over h2 { font-size:26px; font-weight:700; color:#ff6b6b; }
#final-score { font-size:46px; font-weight:700; }
#restart-btn {
  background: linear-gradient(135deg,#ff6b6b,#ff8e53);
  border:none; border-radius:50px;
  padding:13px 36px; color:#fff; font-size:16px; font-weight:600;
  cursor:pointer; min-height:48px; min-width:160px;
}
#restart-btn:active { opacity:0.85; }

/* ─── ローディング ─── */
#loading {
  position:absolute; inset:0;
  background: rgba(5,0,20,0.93);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  color:#fff; gap:12px; z-index:20;
}

/* ─── 図鑑バー ─── */
#fruit-bar {
  flex-shrink: 0;
  display: flex;
  overflow-x: auto;
  gap: 6px;
  padding: 5px 10px 6px;
  background: rgba(0,0,0,0.3);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
#fruit-bar::-webkit-scrollbar { display:none; }
.fc { display:flex; flex-direction:column; align-items:center; flex-shrink:0; gap:2px; }
.fc-img { border-radius:50%; overflow:hidden; }
.fc-img img { width:100%; height:100%; object-fit:cover; display:block; }
.fc-name { font-size:8px; color:rgba(255,255,255,0.5); white-space:nowrap; }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="tb-score">
      <div class="tb-label">スコア</div>
      <div class="tb-value" id="score-val">0</div>
    </div>
    <div class="tb-next">
      <div class="tb-label">NEXT</div>
      <canvas id="next-fruit-canvas"></canvas>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="danger-line"></div>
    <div id="drop-line"></div>

    <div id="game-over">
      <h2>ゲームオーバー</h2>
      <div style="font-size:14px;color:rgba(255,255,255,0.55)">最終スコア</div>
      <div id="final-score">0</div>
      <button id="restart-btn">もう一度あそぶ</button>
    </div>

    <div id="loading">
      <div style="font-size:16px;font-weight:700">ポケモンをよびだしてるよ…</div>
      <div id="load-pct" style="font-size:30px;font-weight:700;color:#f5c518">0%</div>
    </div>
  </div>

  <div id="fruit-bar"></div>
</div>

<script>
const { Engine, Bodies, Body, Events, World } = Matter;

// ────────────────────────────────────────────────
const FRUITS = [
  { name:'マリル',     radius:14, score:1,  color:'#5bb8f5', pokeId:183 },
  { name:'トゲデマル', radius:20, score:3,  color:'#f5e642', pokeId:777 },
  { name:'ペロッパフ', radius:27, score:6,  color:'#f5a7d0', pokeId:684 },
  { name:'トゲピー',   radius:33, score:10, color:'#f5f0c8', pokeId:175 },
  { name:'キノココ',   radius:39, score:15, color:'#a0522d', pokeId:285 },
  { name:'マルマイン', radius:46, score:21, color:'#e8192c', pokeId:101 },
  { name:'ヌメラ',     radius:54, score:28, color:'#a8d8a8', pokeId:704 },
  { name:'ユニラン',   radius:62, score:36, color:'#c8e8f0', pokeId:577 },
  { name:'プリン',     radius:70, score:45, color:'#ffb7c5', pokeId:39  },
  { name:'モクロー',   radius:80, score:55, color:'#8b7355', pokeId:722 },
  { name:'タマザラシ', radius:90, score:66, color:'#b0c8e8', pokeId:363 },
];
const BASE_URL = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';

// ── 画像プリロード ──
const POKE_IMGS = new Array(FRUITS.length).fill(null);
let loadedCount = 0;
FRUITS.forEach((f, i) => {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { POKE_IMGS[i] = img; loadedCount++; };
  img.onerror = () => { loadedCount++; };
  img.src = BASE_URL + f.pokeId + '.png';
});

// ── DOM ──
const wrap       = document.getElementById('canvas-wrap');
const canvas     = document.getElementById('game-canvas');
const nextCanvas = document.getElementById('next-fruit-canvas');
const scoreEl    = document.getElementById('score-val');
const dropLine   = document.getElementById('drop-line');
const dangerLineEl = document.getElementById('danger-line');

const DPR = Math.min(window.devicePixelRatio || 1, 2);

// キャンバスサイズ（CSS px 単位）
let CW = 0, CH = 0;
// 赤線のY座標（CSS px）
const DANGER_RATIO = 0.16;
let DANGER_Y = 0;

let ctx, nextCtx;

function initCanvases() {
  // canvas-wrap の実寸を取得
  const r = wrap.getBoundingClientRect();
  CW = Math.floor(r.width);
  CH = Math.floor(r.height);

  // メインcanvas
  canvas.width  = CW * DPR;
  canvas.height = CH * DPR;
  canvas.style.width  = CW + 'px';
  canvas.style.height = CH + 'px';
  ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);

  // NEXTキャンバス（固定52px）
  const NC = 52;
  nextCanvas.width  = NC * DPR;
  nextCanvas.height = NC * DPR;
  nextCanvas.style.width  = NC + 'px';
  nextCanvas.style.height = NC + 'px';
  nextCtx = nextCanvas.getContext('2d');
  nextCtx.scale(DPR, DPR);

  // 赤線
  DANGER_Y = Math.round(DANGER_RATIO * CH);
  dangerLineEl.style.top = DANGER_Y + 'px';
}

// ── 描画ヘルパ ──
function drawPoke(c, idx, cx, cy, r, angle) {
  const img = POKE_IMGS[idx];
  c.save();
  c.translate(cx, cy);
  if (angle) c.rotate(angle);
  if (img && img.complete && img.naturalWidth > 0) {
    c.drawImage(img, -r, -r, r*2, r*2);
  } else {
    c.fillStyle = FRUITS[idx].color;
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI*2); c.fill();
    c.fillStyle = '#fff';
    c.font = `bold ${Math.max(r*0.28,8)}px sans-serif`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(FRUITS[idx].name, 0, 0);
  }
  c.restore();
}

// ── 図鑑バー ──
function initFruitBar() {
  const bar = document.getElementById('fruit-bar');
  bar.innerHTML = '';
  FRUITS.forEach(f => {
    const sz = Math.min(Math.round(f.radius * 0.5 + 4), 24);
    const d = document.createElement('div');
    d.className = 'fc';
    d.innerHTML = `<div class="fc-img" style="width:${sz}px;height:${sz}px"><img src="${BASE_URL+f.pokeId+'.png'}" crossorigin="anonymous" loading="lazy"></div><div class="fc-name">${f.name}</div>`;
    bar.appendChild(d);
  });
}

// ── NEXT描画 ──
function drawNext() {
  const NC = 52;
  nextCtx.clearRect(0, 0, NC, NC);
  drawPoke(nextCtx, nextFruitIdx, NC/2, NC/2, NC * 0.42);
}

// ── ゲーム状態 ──
let engine, world, bodies = [], pendingMerges = [], particles = [];
let score = 0, gameOver = false, canDrop = true;
let currentFruitIdx, nextFruitIdx;
let cursorX;      // 現在の落下X座標（CSS px）
let isDragging = false;

const WALL_T = 30;

function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pickFruit(){ return randInt(0,4); }

// ── 物理初期化 ──
function initPhysics() {
  engine = Engine.create({ gravity:{ y:2 } });
  world  = engine.world;
  const wo = { isStatic:true, friction:0.05, restitution:0, label:'wall' };
  const fo = { isStatic:true, friction:0.4,  restitution:0, label:'floor' };
  World.add(world, [
    Bodies.rectangle(CW/2,    CH + WALL_T/2,   CW,    WALL_T, fo),
    Bodies.rectangle(-WALL_T/2,    CH/2, WALL_T, CH*2,  wo),
    Bodies.rectangle(CW+WALL_T/2,  CH/2, WALL_T, CH*2,  wo),
  ]);

  const killX = e => e.pairs.forEach(({bodyA,bodyB}) => {
    if (bodyA.label==='wall' && bodyB.label==='fruit') Body.setVelocity(bodyB,{x:0,y:bodyB.velocity.y});
    if (bodyB.label==='wall' && bodyA.label==='fruit') Body.setVelocity(bodyA,{x:0,y:bodyA.velocity.y});
  });
  Events.on(engine,'collisionStart', killX);
  Events.on(engine,'collisionActive', killX);

  Events.on(engine,'afterUpdate', () => {
    bodies.forEach(b => {
      if (b.label!=='fruit') return;
      const r = FRUITS[b.fruitIdx].radius;
      const nL = b.position.x-r < 4, nR = b.position.x+r > CW-4, nF = b.position.y+r > CH-4;
      if ((nL||nR) && Math.abs(b.velocity.x)>0.01) Body.setVelocity(b,{x:0,y:b.velocity.y});
      if ((nL||nR) && nF) { Body.setAngularVelocity(b,0); return; }
      const spd = Math.hypot(b.velocity.x, b.velocity.y);
      if (spd<0.3 && Math.abs(b.angularVelocity)<0.05) Body.setAngularVelocity(b,0);
      if (spd<1.0 && Math.abs(b.angularVelocity)>0.3) Body.setAngularVelocity(b, b.angularVelocity*0.85);
    });
  });

  Events.on(engine,'collisionStart', handleCollision);
}

function makeFruit(x, y, fi) {
  const f = FRUITS[fi];
  const b = Bodies.circle(x, y, f.radius, {
    restitution:0, friction:0.6, frictionAir:0.008,
    frictionStatic:0.3, density:0.004*(fi+1), label:'fruit'
  });
  b.fruitIdx = fi; b.merging = false;
  Body.setInertia(b, b.inertia*0.15);
  World.add(world, b); bodies.push(b);
  return b;
}

function handleCollision(ev) {
  ev.pairs.forEach(({bodyA,bodyB}) => {
    if (bodyA.label!=='fruit'||bodyB.label!=='fruit') return;
    if (bodyA.fruitIdx!==bodyB.fruitIdx) return;
    if (bodyA.merging||bodyB.merging) return;
    if (bodyA.fruitIdx>=FRUITS.length-1) return;
    bodyA.merging=true; bodyB.merging=true;
    pendingMerges.push({bodyA,bodyB,fi:bodyA.fruitIdx});
  });
}

function processMerges() {
  while (pendingMerges.length) {
    const {bodyA,bodyB,fi} = pendingMerges.pop();
    const mx=(bodyA.position.x+bodyB.position.x)/2, my=(bodyA.position.y+bodyB.position.y)/2;
    World.remove(world,bodyA); World.remove(world,bodyB);
    bodies = bodies.filter(b=>b!==bodyA&&b!==bodyB);
    const ni=fi+1, nb=makeFruit(mx,my,ni);
    Body.setVelocity(nb,{x:0,y:-1.5});
    score += FRUITS[ni].score;
    scoreEl.textContent = score;
    spawnFX(mx,my,FRUITS[ni]);
  }
}

function spawnFX(x,y,f) {
  for(let i=0;i<10;i++){
    const a=i/10*Math.PI*2;
    particles.push({x,y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,r:f.radius*0.28,color:f.color,life:1});
  }
}
function tickFX() {
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.life-=0.07;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawFX() {
  particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.fill(); ctx.restore();
  });
}

// ── ドロップ ──
function dropFruit() {
  if (!canDrop||gameOver||cursorX===undefined) return;
  const fr = FRUITS[currentFruitIdx].radius;
  const x  = Math.max(fr+1, Math.min(CW-fr-1, cursorX));
  const body = makeFruit(x, DANGER_Y - fr - 2, currentFruitIdx);
  Body.setVelocity(body,{x:0,y:3});
  canDrop=false;
  currentFruitIdx=nextFruitIdx; nextFruitIdx=pickFruit(); drawNext();
  setTimeout(()=>{ canDrop=true; }, 550);
}

// ── ゲームオーバー判定 ──
function checkOver() {
  return bodies.some(b =>
    !b.merging &&
    b.position.y - FRUITS[b.fruitIdx].radius < DANGER_Y &&
    Math.abs(b.velocity.y)<0.4 && Math.abs(b.velocity.x)<0.4
  );
}

// ── 描画 ──
function render() {
  ctx.clearRect(0,0,CW,CH);
  // 背景
  ctx.fillStyle='#0d0626'; ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='rgba(255,255,255,0.015)';
  for(let i=0;i<40;i++) ctx.fillRect(0,i*28,CW,14);

  // フルーツ本体
  bodies.forEach(b=>{
    if(b.fruitIdx==null) return;
    drawPoke(ctx, b.fruitIdx, b.position.x, b.position.y, FRUITS[b.fruitIdx].radius, b.angle);
  });
  drawFX();

  // ── プレビュー：赤線と白線が交わる点の「上のエリア中央」に表示 ──
  if (!gameOver && cursorX!==undefined && canDrop) {
    const f  = FRUITS[currentFruitIdx];
    const px = Math.max(f.radius+1, Math.min(CW-f.radius-1, cursorX));
    // 赤線(DANGER_Y)より上のエリアの中央 = DANGER_Y / 2
    const py = DANGER_Y / 2;
    ctx.save();
    ctx.globalAlpha = 0.8;
    drawPoke(ctx, currentFruitIdx, px, py, f.radius);
    ctx.restore();
  }
}

// ── ゲームループ ──
let lastT = 0;
function loop(ts) {
  const dt = Math.min(ts-lastT, 50); lastT=ts;
  Engine.update(engine, dt);
  processMerges(); tickFX(); render();
  if (!gameOver && checkOver()) {
    gameOver=true;
    document.getElementById('final-score').textContent=score;
    document.getElementById('game-over').classList.add('show');
    dropLine.style.display='none';
  }
  requestAnimationFrame(loop);
}

// ── ゲーム開始 ──
function startGame() {
  if (engine) { Events.off(engine,'collisionStart'); World.clear(world); Engine.clear(engine); }
  bodies=[]; pendingMerges=[]; particles=[];
  score=0; scoreEl.textContent='0';
  gameOver=false; canDrop=true;
  cursorX=CW/2;
  document.getElementById('game-over').classList.remove('show');
  initPhysics();
  currentFruitIdx=pickFruit(); nextFruitIdx=pickFruit(); drawNext();
  // 白線を中央に初期化
  dropLine.style.left = CW/2 + 'px';
  dropLine.style.display = 'block';
}

// ── 入力 ──
function getCanvasX(e) {
  const rect=canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  return clientX - rect.left;
}

canvas.addEventListener('touchstart', e=>{
  e.preventDefault(); isDragging=true;
  cursorX=getCanvasX(e);
  dropLine.style.left=cursorX+'px'; dropLine.style.display='block';
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault(); if(!isDragging) return;
  cursorX=getCanvasX(e);
  dropLine.style.left=cursorX+'px';
},{passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  if(isDragging){ isDragging=false; dropFruit(); }
},{passive:false});

canvas.addEventListener('mousemove', e=>{
  cursorX=getCanvasX(e);
  dropLine.style.left=cursorX+'px'; dropLine.style.display='block';
});
canvas.addEventListener('click', e=>{
  if(e.target.id==='restart-btn') return; dropFruit();
});
document.getElementById('restart-btn').addEventListener('click', e=>{
  e.stopPropagation(); startGame();
});

// ── 初期化 & ロード待ち ──
initFruitBar();

function waitAndStart() {
  const pct = Math.round(loadedCount/FRUITS.length*100);
  document.getElementById('load-pct').textContent = pct+'%';
  if (loadedCount < FRUITS.length) { setTimeout(waitAndStart,50); return; }
  document.getElementById('loading').remove();
  // canvas-wrap のサイズが確定してから初期化
  requestAnimationFrame(()=>{
    initCanvases();
    startGame();
    requestAnimationFrame(loop);
  });
}
waitAndStart();
  // 履歴を積んでおく
  history.pushState({page: "play"}, null, "");

  window.addEventListener('popstate', function(event) {
    // 予備画面をパッと出す
    const fallback = document.getElementById('fallback-screen');
    if(fallback) {
        fallback.style.display = 'flex';
    }
    // 次に備えてまた履歴を積む
    history.pushState({page: "play"}, null, "");
  });
</script>
</body>
</html>
